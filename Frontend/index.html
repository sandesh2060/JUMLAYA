<!doctype html>
<html lang="en">
  <head>
    <!-- ============================================ -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <meta name="twitter:title" content="JUMLAYA - E-commerce Platform" />
    <meta name="twitter:description" content="Your trusted e-commerce platform for quality products and fast delivery" />
    <meta name="twitter:image" content="/twitter-image.jpg" />
    
    <!-- ============================================ -->
    <!-- FAVICON & ICONS -->
    <!-- ============================================ -->
    <link rel="icon" type="image/x-icon" href="./src/assets/logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#229954" />
    
    <!-- ============================================ -->
    <!-- FONTS -->
    <!-- ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" 
      rel="stylesheet" 
    />
    
    <!-- ============================================ -->
    <!-- TITLE -->
    <!-- ============================================ -->
    <title>JUMLAYA - From Jumla to Your Door | E-commerce Platform in Nepal</title>
    
    <!-- ============================================ -->
    <!-- PRELOAD CRITICAL RESOURCES -->
    <!-- ============================================ -->
    <link rel="preload" href="./src/assets/logo.png" as="image" type="image/png" />
    
    <!-- ============================================ -->
    <!-- STRUCTURED DATA (JSON-LD) -->
    <!-- ============================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JUMLAYA",
      "url": "https://jumlaya.com",
      "description": "From Jumla to Your Door",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jumlaya.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- ============================================ -->
    <!-- CRITICAL CSS - PROFESSIONAL & COMPACT -->
    <!-- ============================================ -->
    <style>
      /* ==================== RESET & BASE ==================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background-color: #ffffff;
        color: #1f2937;
        overflow-x: hidden;
      }
      
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      /* ==================== LOADING SCREEN ==================== */
      .app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0d4d2b 0%, #1e8449 20%, #229954 40%, #27ae60 60%, #229954 80%, #1e8449 100%);
        background-size: 400% 400%;
        animation: gradientFlow 15s ease infinite;
        z-index: 9999;
        overflow: hidden;
      }
      
      /* Animated particles background */
      .particles {
        display: none;
      }
      
      .particle {
        display: none;
      }
      
      /* Glowing circles */
      .glow-circle {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
        animation: glowPulse 8s ease-in-out infinite;
      }
      
      .glow-circle-1 {
        width: 300px;
        height: 300px;
        top: -150px;
        left: -150px;
        animation-delay: 0s;
      }
      
      .glow-circle-2 {
        width: 400px;
        height: 400px;
        bottom: -200px;
        right: -200px;
        animation-delay: 2s;
      }
      
      .glow-circle-3 {
        width: 250px;
        height: 250px;
        top: 50%;
        right: -125px;
        animation-delay: 4s;
      }
      
      .loading-content {
        text-align: center;
        color: white;
        position: relative;
        z-index: 10;
        padding: 2rem;
        max-width: 90%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(1.5rem, 4vw, 2rem);
      }
      
      /* ==================== LOGO CONTAINER ==================== */
      .logo-container {
        margin-bottom: 0;
        animation: logoEntrance 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
      }
      
      /* Rotating ring around logo */
      .logo-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(90px, 20vw, 120px);
        height: clamp(90px, 20vw, 120px);
        border-radius: 50%;
        transform-origin: center;
        animation: ringRotate 4s linear infinite;
      }
      
      .logo-ring::before {
        display: none;
      }
      
      .logo-box {
        width: clamp(75px, 16vw, 100px);
        height: clamp(75px, 16vw, 100px); 
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        border-radius: 50%;
        padding: clamp(16px, 4vw, 22px);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        box-shadow: 
          0 0 40px rgba(255, 255, 255, 0.15),
          0 15px 35px rgba(0, 0, 0, 0.2),
          inset 0 0 30px rgba(255, 255, 255, 0.08);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        animation: logoFloat 4s ease-in-out infinite;
        position: relative;
        z-index: 2;
      }
      
      .logo-box::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
        animation: logoPulse 2s ease-in-out infinite;
      }
      
      .logo-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.25));
      }
      
      /* ==================== BRAND TEXT ==================== */
      .brand-name {
        font-family: 'Poppins', 'Inter', sans-serif;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        margin-bottom: clamp(0.5rem, 1.5vw, 0.75rem);
        animation: fadeInUp 1s ease-out 0.4s both;
        text-shadow: 
          0 0 30px rgba(255, 255, 255, 0.4),
          0 2px 15px rgba(0, 0, 0, 0.25);
        background: linear-gradient(to right, #ffffff, #f0f0f0, #ffffff);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        animation: fadeInUp 1s ease-out 0.4s both, shimmer 3s linear infinite;
      }
      
      .tagline {
        font-size: clamp(0.95rem, 2.5vw, 1.05rem);
        opacity: 0.9;
        font-weight: 400;
        animation: fadeInUp 1s ease-out 0.6s both;
        line-height: 1.5;
        max-width: 90%;
        margin: 0 auto;
        letter-spacing: 0.01em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      }
      
      /* ==================== TRUCK LOADER ==================== */
      .truck-loader {
        margin-top: 2rem;
        position: relative;
        width: 200px;
        height: 60px;
        animation: fadeIn 1s ease-out 0.8s both;
      }
      
      /* Road */
      .road {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        overflow: hidden;
      }
      
      .road::before {
        content: '';
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 2px;
        background: white;
        animation: roadMove 1s linear infinite;
      }
      
      /* Truck */
      .truck {
        position: absolute;
        bottom: 8px;
        left: 0;
        width: 40px;
        height: 25px;
        animation: truckMove 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      }
      
      /* Truck cabin */
      .truck-cabin {
        position: absolute;
        right: 0;
        bottom: 8px;
        width: 16px;
        height: 18px;
        background: white;
        border-radius: 2px 2px 0 0;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      
      /* Truck cargo */
      .truck-cargo {
        position: absolute;
        left: 0;
        bottom: 8px;
        width: 26px;
        height: 14px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 1px;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
      }
      
      /* Wheels */
      .truck-wheel {
        position: absolute;
        bottom: 0;
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        animation: wheelSpin 0.6s linear infinite;
      }
      
      .truck-wheel:first-of-type {
        left: 4px;
      }
      
      .truck-wheel:last-of-type {
        right: 4px;
      }
      
      /* ==================== ANIMATIONS ==================== */
      @keyframes gradientFlow {
        0%, 100% { 
          background-position: 0% 50%; 
        }
        50% { 
          background-position: 100% 50%; 
        }
      }
      
      @keyframes particleFloat {
        0% {
          transform: translateY(100vh) translateX(0) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) translateX(100px) scale(1);
          opacity: 0;
        }
      }
      
      @keyframes glowPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.6;
        }
      }
      
      @keyframes logoEntrance {
        0% {
          opacity: 0;
          transform: scale(0.3) rotate(-180deg);
        }
        60% {
          transform: scale(1.1) rotate(10deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      
      @keyframes logoFloat {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      
      @keyframes logoPulse {
        0%, 100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 0.6;
          transform: scale(1.1);
        }
      }
      
      @keyframes ringRotate {
        0% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        100% {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
      
      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      
      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes shimmer {
        0% {
          background-position: 200% center;
        }
        100% {
          background-position: -200% center;
        }
      }
      
      @keyframes dotBounce {
        0%, 80%, 100% {
          transform: scale(0.8) translateY(0);
          opacity: 0.7;
        }
        40% {
          transform: scale(1.1) translateY(-15px);
          opacity: 1;
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
        }
      }
      
      @keyframes dotPulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 
            0 0 20px rgba(255, 255, 255, 1),
            0 0 40px rgba(255, 255, 255, 0.6),
            0 0 60px rgba(255, 255, 255, 0.3);
        }
        50% {
          transform: scale(1.4);
          box-shadow: 
            0 0 30px rgba(255, 255, 255, 1),
            0 0 60px rgba(255, 255, 255, 0.8),
            0 0 90px rgba(255, 255, 255, 0.5);
        }
      }
      
      @keyframes truckMove {
        0% {
          left: -50px;
        }
        70% {
          left: calc(100% + 10px);
        }
        70.01% {
          left: calc(100% + 10px);
        }
        70.02% {
          left: -50px;
        }
        100% {
          left: -50px;
        }
      }
      
      @keyframes roadMove {
        0% {
          left: -30px;
        }
        100% {
          left: 100%;
        }
      }
      
      @keyframes wheelSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      
      /* ==================== RESPONSIVE BREAKPOINTS ==================== */
      
      /* Small phones (320px - 480px) */
      @media (max-width: 480px) {
        html {
          font-size: 14px;
        }
        
        .loading-content {
          padding: 1.5rem 1rem;
        }
        
        .logo-ring {
          display: none;
        }
      }
      
      /* Tablets (481px - 768px) */
      @media (min-width: 481px) and (max-width: 768px) {
        html {
          font-size: 15px;
        }
      }
      
      /* Landscape tablets and small laptops (769px - 1024px) */
      @media (min-width: 769px) and (max-width: 1024px) {
        html {
          font-size: 16px;
        }
      }
      
      /* Landscape orientation adjustments */
      @media (orientation: landscape) and (max-height: 600px) {
        .logo-container {
          margin-bottom: 1rem;
        }
        
        .loading-spinner {
          margin-top: 1rem;
        }
        
        .brand-name {
          font-size: clamp(1.5rem, 4vw, 1.75rem);
          margin-bottom: 0.5rem;
        }
        
        .tagline {
          font-size: clamp(0.85rem, 2vw, 0.95rem);
        }
      }
      
      /* Ultra-wide screens */
      @media (min-width: 1920px) {
        .loading-content {
          max-width: 900px;
        }
      }
      
      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============================================ -->
    <!-- NO SCRIPT WARNING -->
    <!-- ============================================ -->
    <noscript>
      <div style="text-align: center; padding: 3rem 1rem; font-family: 'Inter', sans-serif; max-width: 600px; margin: 0 auto;">
        <h1 style="color: #dc2626; margin-bottom: 1rem; font-size: clamp(1.5rem, 5vw, 2rem);">JavaScript Required</h1>
        <p style="color: #6b7280; font-size: clamp(0.875rem, 2.5vw, 1rem);">Please enable JavaScript in your browser to use JUMLAYA.</p>
      </div>
    </noscript>
    
    <!-- ============================================ -->
    <!-- PROFESSIONAL LOADING SCREEN -->
    <!-- ============================================ -->
    <div id="app-loading" class="app-loading">
      <!-- Glowing Circles -->
      <div class="glow-circle glow-circle-1"></div>
      <div class="glow-circle glow-circle-2"></div>
      <div class="glow-circle glow-circle-3"></div>
      
      <div class="loading-content">
        <!-- Logo with Rotating Ring -->
        <div class="logo-container">
          <div class="logo-ring"></div>
          <div class="logo-box">
            <img src="./src/assets/logo.png" alt="JUMLAYA Logo" />
          </div>
        </div>
        
        <!-- Truck Loader -->
        <div class="truck-loader">
          <div class="road"></div>
          <div class="truck">
            <div class="truck-cargo"></div>
            <div class="truck-cabin"></div>
            <div class="truck-wheel"></div>
            <div class="truck-wheel"></div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- ============================================ -->
    <!-- REACT ROOT -->
    <!-- ============================================ -->
    <div id="root"></div>
    
    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Smooth fade-out when React app loads -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loading');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 1s ease-out';
            
            setTimeout(() => {
              loader.remove();
            }, 1000);
          }
        }, 1500);
      });
      
      document.addEventListener('visibilitychange', () => {
        const loader = document.getElementById('app-loading');
        if (loader) {
          loader.style.animationPlayState = document.hidden ? 'paused' : 'running';
        }
      });
      
      setTimeout(() => {
        const loader = document.getElementById('app-loading');
        if (loader && document.querySelector('#root').children.length > 0) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.8s ease-out';
          setTimeout(() => loader.remove(), 800);
        }
      }, 4000);
    </script>
  </body>
</html>
